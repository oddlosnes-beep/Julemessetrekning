<!DOCTYPE html>
<html lang="nb">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Trekk</title>
<link rel="icon" type="image/png" href="/icon-mobil.png">
<style>
:root{--ink:#1b2a24;--muted:#5a6a62;--acc:#14332a;--ok:#1d6b46;--bad:#b3262e}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:flex;flex-direction:column;font-family:system-ui,Segoe UI,Arial,sans-serif;color:var(--ink);background:#eef2ef;text-align:center}
header{background:var(--acc);color:#fff;padding:14px 16px;font-size:20px;font-weight:700}
main{flex:1;display:flex;flex-direction:column;justify-content:center;padding:16px;gap:14px}
#prize{font-size:20px;color:var(--muted)}
#num{font-size:96px;font-weight:800;line-height:1}
#info{font-size:22px;min-height:30px}
button{font:inherit;font-weight:800;font-size:34px;padding:26px;border:0;border-radius:18px;background:var(--ok);color:#fff;width:100%}
button:disabled{background:#9aa8a1}
#ar input{font:inherit;width:90px;padding:8px;border:2px solid #b9c2bd;border-radius:10px;text-align:center}
button.s{font-size:20px;padding:14px;margin-top:10px;background:#fff;color:var(--ink);border:2px solid #b9c2bd}
button.s.r{color:var(--bad)}
#msg{color:var(--bad);font-size:17px;min-height:22px}
</style>
</head>
<body>
<header id="t">Trekning</header>
<main>
<div id="prize"></div>
<div id="num">?</div>
<div id="info"></div>
<button id="go" disabled>Trekk</button>
<div id="msg"></div>
<div id="ar" hidden style="margin-top:10px;padding-top:14px;border-top:1px solid #c5cec9;font-size:18px">
<div>Åresalg: lodd nr <input id="af" type="number" min="0"> til <input id="at" type="number" min="0"></div>
<button id="asave" class="s">Lagre antall</button>
<button id="areset" class="s r">Nullstill åresalg</button></div>
</main>
<script>
(function(){
var $=function(i){return document.getElementById(i)},st=null,wait=0;
function show(){
 if(!st){$("msg").textContent="Mistet kontakten. Prøver igjen… (sjekk at du er på samme wifi som PC-en)";$("go").disabled=true;return}
 $("t").textContent=st.title||"Trekning";
 $("prize").textContent=st.prize||"";
 $("num").textContent=st.busy?"…":(st.num||"?");
 $("info").textContent=st.busy?"Trekker…":(st.info||"");
 var ok=st.on&&!st.busy&&st.left>0&&Date.now()>wait;
 $("go").disabled=!ok;
 $("go").textContent=st.left===0?"Alt er trukket":"Trekk";
 $("msg").textContent=st.on?"":"Trekking fra mobil er ikke slått på på PC-en.";
 var ar=st.on&&st.mode==="ares";$("ar").hidden=!ar;
 if(ar){if(document.activeElement!==$("af"))$("af").value=st.aFrom;if(document.activeElement!==$("at"))$("at").value=st.aTo}
}
var inflight=false,fails=0;
function poll(){
 if(inflight)return;inflight=true;
 var ac=window.AbortController?new AbortController():null,tm=setTimeout(function(){if(ac)ac.abort()},3000);
 fetch("/api/trekk",ac?{signal:ac.signal,cache:"no-store"}:{cache:"no-store"}).then(function(r){return r.json()}).then(function(s){fails=0;st=s;show()}).catch(function(){if(++fails>=2){st=null;show()}}).then(function(){clearTimeout(tm);inflight=false});
}
function wake(){try{if(navigator.wakeLock)navigator.wakeLock.request("screen").catch(function(){})}catch(e){}}
document.addEventListener("visibilitychange",function(){if(!document.hidden){wake();poll()}});
window.addEventListener("online",poll);wake();
$("go").onclick=function(){
 $("go").disabled=true;wait=Date.now()+3000;
 fetch("/api/trekk/knapp",{method:"POST"}).then(function(r){if(!r.ok)$("msg").textContent="Kunne ikke trekke.";poll()}).catch(function(){$("msg").textContent="Ingen kontakt."});
 setTimeout(show,3100);
};
function post(b){return fetch("/api/trekk/ares",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(b)}).then(function(r){if(!r.ok)$("msg").textContent="Kunne ikke endre.";poll()})}
$("asave").onclick=function(){post({act:"range",from:$("af").value,to:$("at").value});$("asave").textContent="Lagret";setTimeout(function(){$("asave").textContent="Lagre antall"},1500)};
var rt=null;$("areset").onclick=function(){
 if(rt){clearTimeout(rt);rt=null;$("areset").textContent="Nullstill åresalg";post({act:"reset"});return}
 $("areset").textContent="Sikker? Trykk igjen";rt=setTimeout(function(){rt=null;$("areset").textContent="Nullstill åresalg"},4000)};
poll();setInterval(poll,800);
})();
</script>
</body>
</html>
